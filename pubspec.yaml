name: generator_portal
description: "بوابة المولدات - Generator Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  # State + Routing + Theme
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  shared_preferences: ^2.2.0
  # Image handling
  image_picker: ^1.1.0
  image: ^4.2.0
  # Animations
  flutter_animate: ^4.5.0
  # Utils
  intl: ^0.20.2
  # Local notifications
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.3.0
  flutter_launcher_icons: ^0.14.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/brand/approved-a/ios-icon-1024.png
  adaptive_icon_background: "#F3F1EB"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_foreground: assets/brand/approved-a/adaptive-foreground-432.png
  adaptive_icon_monochrome: assets/brand/approved-a/adaptive-monochrome-432.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/brand/approved-a/mark-primary-384.png
    - assets/brand/approved-a/mark-reversed-384.png
  fonts:
    - family: PortalArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: PortalCurrency
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

flutter_native_splash:
  color: "#F3F1EB"
  color_dark: "#13262A"
  image: assets/brand/approved-a/mark-primary-384.png
  image_dark: assets/brand/approved-a/mark-reversed-384.png
  android_12:
    color: "#F3F1EB"
    color_dark: "#13262A"
    image: assets/brand/approved-a/adaptive-foreground-432.png
    image_dark: assets/brand/approved-a/mark-reversed-384.png
  android: true
  ios: true
  web: false
