name: generator_portal
description: "بوابة المولدات - Generator Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  # State + Routing + Theme
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  shared_preferences: ^2.2.0
  # Image handling
  image_picker: ^1.1.0
  image: ^4.2.0
  # Animations
  flutter_animate: ^4.5.0
  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.3.0

flutter_native_splash:
  color: "#1E3A6E"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
